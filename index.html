  :host {
    display: block;
    position: relative;
    overflow: hidden;
    background: #000;
    contain: layout style;
  }

  /* The only in-flow child: with no height set, the player takes the composition's shape. */
  .hfp-sizer {
    aspect-ratio: 16 / 9;
  }

  .hfp-container {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }


  .hfp-iframe {
    position: absolute;
    top: 50%;
    left: 50%;
    border: none;
    pointer-events: none;
  }

  /* Opt-in: an interactive composition (e.g. a live slideshow/app with playable
     media or controls): let pointer events reach the iframe content. */
  :host([interactive]) .hfp-container,
  :host([interactive]) .hfp-iframe {
    pointer-events: auto;
  }

  .hfp-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    pointer-events: none;
  }

  .hfp-poster {
    position: absolute;
    inset: 0;
    object-fit: contain;
    z-index: 1;
    pointer-events: none;
  }

  .hfp-shader-loader {
    position: absolute;
    inset: 0;
    z-index: 20;
    display: grid;
    place-items: center;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    background: #030504;
    color: #f4f7fb;
    cursor: default;
    user-select: none;
    -webkit-user-select: none;
    transition: opacity 420ms ease-out, visibility 420ms ease-out;
  }

  .hfp-shader-loader.hfp-visible,
  .hfp-shader-loader.hfp-hiding {
    visibility: visible;
  }

  .hfp-shader-loader.hfp-visible {
    opacity: 1;
    pointer-events: auto;
  }

  .hfp-shader-loader.hfp-hiding {
    opacity: 0;
    pointer-events: none;
  }

  .hfp-shader-loader-panel {
    display: grid;
    grid-template-rows: 86px 40px 26px 12px 44px;
    justify-items: center;
    align-items: center;
    gap: 8px;
    width: min(620px, 82%);
    text-align: center;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .hfp-shader-loader-mark {
    width: 86px;
    height: 86px;
    display: grid;
    place-items: center;
    overflow: visible;
  }

  .hfp-shader-loader-mark svg {
    display: block;
    overflow: visible;
    filter: drop-shadow(0 0 5px rgba(79, 219, 94, 0.16));
    pointer-events: none;
  }

  .hfp-shader-loader-title {
    width: 100%;
    height: 40px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    font-size: 26px;
    line-height: 40px;
    font-weight: 700;
    letter-spacing: 0;
  }

  .hfp-shader-loader-title-text {
    color: transparent;
    background: linear-gradient(
      90deg,
      rgba(244, 247, 251, 0.84) 0%,
      #ffffff 42%,
      #80efe4 52%,
      #ffffff 62%,
      rgba(244, 247, 251, 0.84) 100%
    );
    background-size: 220% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    animation: hfp-shader-loader-sheen 1.9s linear infinite;
  }

  .hfp-shader-loader:not(.hfp-visible):not(.hfp-hiding) .hfp-shader-loader-title-text {
    animation-play-state: paused;
  }

  .hfp-shader-loader-detail {
    width: 100%;
    height: 26px;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    color: rgba(244, 247, 251, 0.62);
    font-size: 15px;
    line-height: 26px;
    font-weight: 500;
  }

  .hfp-shader-loader-track {
    width: min(360px, 100%);
    height: 8px;
    overflow: hidden;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.1);
  }

  .hfp-shader-loader-fill {
    width: 100%;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, #06e3fa, #4fdb5e);
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform 160ms ease;
  }

  .hfp-shader-loader-progress {
    width: min(420px, 100%);
    height: 44px;
    display: grid;
    grid-template-rows: repeat(2, 22px);
    color: rgba(244, 247, 251, 0.48);
    font: 600 13px/22px "IBM Plex Mono", "SF Mono", "Fira Code", "Courier New", monospace;
    font-variant-numeric: tabular-nums;
  }

  .hfp-shader-loader-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 74px;
    align-items: center;
    column-gap: 20px;
    width: 100%;
    white-space: nowrap;
  }

  .hfp-shader-loader-label {
    min-width: 0;
    overflow: hidden;
    text-align: left;
    text-overflow: ellipsis;
  }

  .hfp-shader-loader-value {
    text-align: right;
  }

  /* Loading assets and Buffering: the frame softly blurred, the mark alone over it with a light
     passing over. filter, transform and opacity only, no backdrop-filter, which drops frames on
     Safari; the frame is still while it waits, so the blur is painted once. */
  .hfp-iframe,
  .hfp-poster {
    transition: filter 400ms ease-out;
  }

  :host([assets-loading]:not([assets-loading-ui="none"])) .hfp-iframe,
  :host([assets-loading]:not([assets-loading-ui="none"])) .hfp-poster,
  :host([buffering]:not([assets-loading-ui="none"])) .hfp-iframe,
  :host([buffering]:not([assets-loading-ui="none"])) .hfp-poster {
    filter: blur(6px) saturate(0.85);
    transition-duration: 180ms;
  }

  .hfp-shader-loader.hfp-assets {
    background: transparent;
  }

  .hfp-shader-loader.hfp-assets .hfp-shader-loader-panel {
    grid-template-rows: auto;
    width: auto;
  }

  .hfp-shader-loader.hfp-assets .hfp-shader-loader-title,
  .hfp-shader-loader.hfp-assets .hfp-shader-loader-detail,
  .hfp-shader-loader.hfp-assets .hfp-shader-loader-track,
  .hfp-shader-loader.hfp-assets .hfp-shader-loader-progress {
    display: none;
  }

  .hfp-shader-loader-mark {
    position: relative;
  }

  .hfp-shader-loader-sheen {
    display: none;
    position: absolute;
    inset: 0;
    overflow: hidden;
    mask-size: contain;
    mask-repeat: no-repeat;
    mask-position: center;
    -webkit-mask-size: contain;
    -webkit-mask-repeat: no-repeat;
    -webkit-mask-position: center;
  }

  .hfp-shader-loader.hfp-assets .hfp-shader-loader-sheen {
    display: block;
  }

  .hfp-shader-loader-sheen::before {
    content: "";
    position: absolute;
    inset: 0 auto 0 -60%;
    width: 60%;
    background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.85), transparent);
    animation: hfp-shader-loader-sweep 1700ms cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }

  .hfp-shader-loader:not(.hfp-visible):not(.hfp-hiding) .hfp-shader-loader-sheen::before {
    animation-play-state: paused;
  }

  @keyframes hfp-shader-loader-sweep {
    0% {
      transform: translateX(0);
    }
    55%,
    100% {
      transform: translateX(280%);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .hfp-iframe,
    .hfp-poster {
      transition: none;
    }

    .hfp-shader-loader-sheen::before {
      animation: none;
    }
  }

  @keyframes hfp-shader-loader-sheen {
    from {
      background-position: 140% 0;
    }
    to {
      background-position: -140% 0;
    }
  }

  /* \u2500\u2500 Theming via CSS custom properties \u2500\u2500
   *
   * Override from outside the shadow DOM:
   *   hyperframes-player {
   *     --hfp-controls-bg: linear-gradient(transparent, rgba(0,0,0,0.9));
   *     --hfp-accent: #ff6b6b;
   *     --hfp-font: "Inter", sans-serif;
   *   }
   */

  .hfp-controls {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    gap: var(--hfp-controls-gap, 12px);
    padding: var(--hfp-controls-padding, 8px 16px);
    background: var(--hfp-controls-bg, linear-gradient(transparent, rgba(0, 0, 0, 0.7)));
    color: var(--hfp-color, #fff);
    font-family: var(--hfp-font, system-ui, -apple-system, sans-serif);
    font-size: var(--hfp-font-size, 13px);
    z-index: 10;
    pointer-events: auto;
    opacity: 1;
    transition: opacity 0.3s ease;
    user-select: none;
  }

  .hfp-controls.hfp-hidden {
    opacity: 0;
    pointer-events: none;
  }

  .hfp-play-btn {
    position: relative;
    background: none;
    border: none;
    color: var(--hfp-color, #fff);
    cursor: pointer;
    padding: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    z-index: 10;
  }

  .hfp-play-btn:hover {
    opacity: 0.8;
  }

  /* Stacked play/pause glyphs that crossfade-morph on toggle (rotate + scale). */
  .hfp-play-btn .hfp-ico {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    transition:
      opacity 200ms ease,
      transform 220ms cubic-bezier(0.4, 0, 0.2, 1);
  }
  .hfp-play-btn .hfp-ico-play {
    opacity: 1;
    transform: rotate(0) scale(1);
  }
  .hfp-play-btn .hfp-ico-pause {
    opacity: 0;
    transform: rotate(-90deg) scale(0.4);
  }
  .hfp-play-btn.hfp-playing .hfp-ico-play {
    opacity: 0;
    transform: rotate(90deg) scale(0.4);
  }
  .hfp-play-btn.hfp-playing .hfp-ico-pause {
    opacity: 1;
    transform: rotate(0) scale(1);
  }
  @media (prefers-reduced-motion: reduce) {
    .hfp-play-btn .hfp-ico {
      transition-duration: 0ms;
      transform: none;
    }
  }

  .hfp-play-btn svg,
  .hfp-play-btn svg * {
    pointer-events: none;
  }

  .hfp-scrubber {
    flex: 1;
    min-width: 0;
    height: var(--hfp-scrubber-height, 4px);
    background: var(--hfp-scrubber-bg, rgba(255, 255, 255, 0.3));
    border-radius: var(--hfp-scrubber-radius, 2px);
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }

  .hfp-scrubber:hover {
    height: var(--hfp-scrubber-height-hover, 6px);
  }

  .hfp-progress {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    background: var(--hfp-accent, #fff);
    pointer-events: none;
  }

  .hfp-time {
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
    opacity: 0.9;
  }

  .hfp-speed-wrap {
    position: relative;
    flex-shrink: 0;
  }

  .hfp-speed-btn {
    background: var(--hfp-speed-btn-bg, rgba(255, 255, 255, 0.15));
    border: none;
    border-radius: var(--hfp-speed-btn-radius, 4px);
    color: var(--hfp-color, #fff);
    cursor: pointer;
    font-family: var(--hfp-font, system-ui, -apple-system, sans-serif);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    padding: 4px 8px;
    min-width: 40px;
    text-align: center;
    transition: background 0.15s ease;
  }

  .hfp-speed-btn:hover {
    background: var(--hfp-speed-btn-bg-hover, rgba(255, 255, 255, 0.3));
  }

  .hfp-speed-menu {
    position: absolute;
    bottom: calc(100% + 8px);
    right: 0;
    background: var(--hfp-menu-bg, rgba(20, 20, 20, 0.95));
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--hfp-menu-border, rgba(255, 255, 255, 0.1));
    border-radius: var(--hfp-menu-radius, 8px);
    padding: 4px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 80px;
    opacity: 0;
    visibility: hidden;
    transform: translateY(4px);
    transition: opacity 0.15s ease, transform 0.15s ease, visibility 0.15s;
    box-shadow: var(--hfp-menu-shadow, 0 8px 24px rgba(0, 0, 0, 0.4));
  }

  .hfp-speed-menu.hfp-open {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  .hfp-speed-option {
    background: none;
    border: none;
    border-radius: 4px;
    color: var(--hfp-menu-color, rgba(255, 255, 255, 0.7));
    cursor: pointer;
    font-family: var(--hfp-font, system-ui, -apple-system, sans-serif);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    padding: 6px 12px;
    text-align: left;
    transition: background 0.1s ease, color 0.1s ease;
    white-space: nowrap;
  }

  .hfp-speed-option:hover {
    background: var(--hfp-menu-hover-bg, rgba(255, 255, 255, 0.1));
    color: var(--hfp-color, #fff);
  }

  .hfp-speed-option.hfp-active {
    color: var(--hfp-accent, #fff);
    font-weight: 600;
  }

  .hfp-volume-wrap {
    position: relative;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 0;
  }

  .hfp-mute-btn {
    background: none;
    border: none;
    color: var(--hfp-color, #fff);
    cursor: pointer;
    padding: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    flex-shrink: 0;
  }

  .hfp-mute-btn:hover {
    opacity: 0.8;
  }

  .hfp-mute-btn svg,
  .hfp-mute-btn svg * {
    pointer-events: none;
  }

  .hfp-volume-slider-wrap {
    width: 0;
    overflow: hidden;
    transition: width 0.2s ease;
    display: flex;
    align-items: center;
  }

  .hfp-volume-wrap:hover .hfp-volume-slider-wrap {
    width: 64px;
  }

  .hfp-volume-slider {
    width: 56px;
    height: var(--hfp-scrubber-height, 4px);
    background: var(--hfp-scrubber-bg, rgba(255, 255, 255, 0.3));
    border-radius: var(--hfp-scrubber-radius, 2px);
    cursor: pointer;
    position: relative;
    overflow: hidden;
    margin-left: 4px;
    margin-right: 4px;
  }

  .hfp-volume-fill {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    background: var(--hfp-accent, #fff);

&lt;style&gt;
:root{--pink:#FF66C2;--org:#FF8B59;--line:#F8E5DC;--g:linear-gradient(90deg,#FF66C2,#FF8B59)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#fff}
.scene{position:absolute;top:0;left:0;width:1920px;height:1080px;overflow:hidden;opacity:0;visibility:hidden;pointer-events:none;display:flex;flex-direction:column;padding:64px 96px 130px;background:#fff;color:#555;font-family:&#x27;Montserrat&#x27;,system-ui,sans-serif}
.scene::after{content:&quot;&quot;;position:absolute;left:0;right:0;bottom:0;height:22px;background:var(--g)}
.scene.grad{background:var(--g);color:#fff}.scene.grad::after{background:var(--org)}
.head{display:flex;align-items:center;flex:none}
.kicker{font-family:&#x27;Glacial Indifference&#x27;,&#x27;Montserrat&#x27;,sans-serif;font-weight:700;font-size:30px;letter-spacing:.14em;text-transform:uppercase;color:var(--org)}
.grad .kicker{color:#fff}
.num{margin-left:auto;font-weight:700;font-size:28px;color:#D8C8C0}.grad .num{color:#fff;opacity:.85}
h1.t{font-weight:800;font-size:68px;line-height:1.1;letter-spacing:-.01em;margin-top:22px;padding-bottom:6px;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
h1.t.xl{font-size:150px;line-height:1}
.grad h1.t{background:none;color:#fff}
.lead{font-size:32px;line-height:1.42;letter-spacing:.025em;margin-top:22px;max-width:1700px}
.body{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;margin-top:20px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:36px;align-items:start}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:32px;align-items:start}
.g3 .v{font-size:110px;line-height:1.05}.g3 .card{padding:22px 28px}.g3 .l li{font-size:25px}.body{margin-top:34px}.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;align-items:start}.g4 .card{padding:24px 26px}.g4 .card p{font-size:24px}.g4 .card h3{font-size:23px;letter-spacing:.06em}.g4 .ic{width:60px;height:60px;font-size:26px}.g4 .ch{gap:14px}
.card{background:#fff;border:4px solid var(--line);border-radius:32px;padding:30px 36px;box-shadow:0 14px 40px rgba(255,139,89,.14)}
.card h3{font-weight:700;font-size:28px;letter-spacing:.1em;text-transform:uppercase;color:var(--org);margin-bottom:12px;line-height:1.2}
.card.p h3{color:var(--pink)}
.card p{font-size:27px;line-height:1.4;letter-spacing:.02em}
ul.l{list-style:none}
ul.l li{font-size:28px;line-height:1.35;letter-spacing:.025em;padding:5px 0 5px 34px;position:relative}
ul.l li::before{content:&quot;\2022&quot;;position:absolute;left:0;color:var(--org);font-weight:800}
ul.ck li::before{content:&quot;\2713&quot;;font-family:system-ui,sans-serif}
.ic{width:78px;height:78px;border-radius:50%;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:30px;flex:none}
.ch{display:flex;align-items:center;gap:18px;margin-bottom:12px}.ch h3{margin:0}
.v{font-weight:800;font-size:120px;line-height:1;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center}
.vl{font-weight:700;font-size:26px;letter-spacing:.06em;color:var(--pink);text-align:center;margin:10px 0 14px;line-height:1.25}
.st3{display:flex;gap:130px;margin-top:70px}.st3 div{text-align:center}
.st3 b{display:block;font-weight:800;font-size:100px;line-height:1}.st3 span{font-weight:700;font-size:26px;letter-spacing:.12em;text-transform:uppercase}
table.tb{width:100%;border-collapse:collapse;font-size:32px}
.tb th{background:var(--org);color:#fff;text-align:left;padding:20px 28px;font-weight:700;font-size:32px}.tb th:first-child{background:var(--pink)}
.tb td{padding:20px 28px;border:2px solid #E9E1DC;color:#555;letter-spacing:.02em}
.tb.pl th{background:#fff;color:var(--pink);border:2px solid #E9E1DC}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.chip{border-radius:20px;padding:30px 12px;text-align:center;font-weight:800;font-size:28px;letter-spacing:.16em;color:#555;background:linear-gradient(90deg,#FFB0DE,#FFC1A3)}
.chip.w{background:#fff;color:var(--pink);font-size:25px;letter-spacing:.1em;border:3px solid var(--line)}
.band{background:var(--g);border-radius:28px;padding:30px 36px}
.band h3{color:#fff;font-weight:700;font-size:28px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:20px}
.mid{text-align:center;color:var(--pink);font-size:26px;letter-spacing:.14em;margin:26px 0}
.row{display:flex;gap:26px;align-items:center;font-weight:700;font-size:42px;margin-top:26px;color:#fff;letter-spacing:.02em}.row i{font-style:normal;font-size:50px}
.src{font-size:23px;color:var(--org);letter-spacing:.03em;margin-top:20px;line-height:1.4}
.foot{position:absolute;left:96px;bottom:50px;font-size:26px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--pink)}
.grad .foot{color:#fff}
[data-frag]{opacity:0}
